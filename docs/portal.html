<style>
/* The live portal's own stylesheet (the-block src/app/globals.css at main 16542be), so the prototype looks like
   block.allinknifeguy.com, plus a thin prototype bar on top and the texting screens that aren't built yet.
   This copy is the Agent Explorer's portal example (events-team-explorer src/portal.html): a sample coordinator, and
   what The Block gained through main 9521d2a (What your agents need, Notes for Claude, Freshmen Onboarding and its page).
   Phone first: header, content, a bottom tab bar. From 900px wide: a navy sidebar and a wider content column. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #16213a; --muted: #56627a; --line: #dde1ea;
  --sun: #dd6b1a; --sun-ink: #b04f0b; --sun-soft: #fcede1;
  --navy: #111a2c; --navy-2: #1a2540; --navy-line: #2b3752; --navy-ink: #eef1f6; --navy-muted: #aab4c6; --gold: #f5be45;
  --ok: #1f7139; --ok-bg: #e2f3e7; --wip: #8a5300; --wip-bg: #fbefd7; --bad: #9b2c24; --bad-bg: #fbeaea;
  --mark-bg: #16213a; --mark-fg: #ffffff; --mark-accent: #f07a22; --on-sun: #ffffff; --scrim: rgba(10, 16, 28, 0.45);
  --shadow: 0 1px 2px rgba(17, 26, 44, 0.05), 0 8px 24px rgba(17, 26, 44, 0.07);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --ph: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1524; --surface: #162034; --ink: #e8ecf3; --muted: #a1acbe; --line: #28334b;
    --sun: #ff9a47; --sun-ink: #ffb173; --sun-soft: #33231a; --navy: #0a101c; --navy-2: #141d30; --navy-line: #26324a;
    --ok: #7dd99d; --ok-bg: #173325; --wip: #f5c46a; --wip-bg: #3a2c12; --bad: #f19a92; --bad-bg: #3a1b19;
    --mark-bg: #24345a; --on-sun: #111a2c; --shadow: 0 1px 2px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1524; --surface: #162034; --ink: #e8ecf3; --muted: #a1acbe; --line: #28334b;
  --sun: #ff9a47; --sun-ink: #ffb173; --sun-soft: #33231a; --navy: #0a101c; --navy-2: #141d30; --navy-line: #26324a;

  --mark-bg: #24345a; --on-sun: #111a2c; --shadow: 0 1px 2px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.6);

}

* { box-sizing: border-box; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15.5px; text-decoration: none; color: var(--ink); }

@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.auth { min-height: calc(100dvh - var(--ph)); display: grid; place-items: center; align-content: center; gap: 14px; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.wiz { max-width: 640px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

.side .wordmark small { color: var(--gold); }

.side nav a { display: flex; align-items: center; gap: 10px; color: var(--navy-muted); padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 15px; text-decoration: none; }
.side nav a:hover { color: #fff; background: var(--navy-2); }
.side nav a[aria-current="page"] { color: #fff; background: var(--navy-2); box-shadow: inset 3px 0 0 var(--gold); }
.side .who { margin-top: auto; font-size: 13.5px; color: var(--navy-muted); border-top: 1px solid var(--navy-line); padding-top: 14px; display: grid; gap: 8px; }
.side .who b { display: block; color: #fff; font-size: 14.5px; }
.switcher select { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--navy-line); background: var(--navy-2); color: #fff; padding: 6px 10px; }
.main { min-width: 0; padding-block: 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; max-width: 1040px; }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.topline .mono a { color: inherit; }
.tabbar, .mhead { display: none; }

  .app { grid-template-columns: minmax(0, 1fr); }

  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--navy); color: #fff; }
  .mhead .wordmark b { color: #fff; font-size: 22px; }

  .mhead .mark { width: 32px; height: 32px; }
  .mhead .switcher select { max-width: 46vw; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

}

/* Agents' rules and Jarvis's documents */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs a, .tabs button { padding: 9px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; }
.tabs a[aria-current="page"], .tabs button[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.select, .pct { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); max-width: 100%; }

.search { flex: 1; min-width: min(220px, 100%); min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

      if (p === 'gdoc' && !/^https:\/\/docs\.google\.com\/document\/d\/[A-Za-z0-9_-]{10,}/.test(val('gdoc-url'))) { S.docRes = { ok: false, text: 'Paste the Doc’s full link, starting with https://docs.google.com/document/d/.' }; render(); return; }
      DOCS.push({ id: DOCS.length + 1, kind: val(p + '-kind'), title: title, source: p === 'gdoc' ? 'gdoc' : 'upload', read: 'Thu, Dec 10, just now', status: waits() ? 'waiting' : 'live', div: val(p + '-division') || null, body: '(Prototype: the document’s text shows here, exactly as Jarvis reads it.)' });
      S.docRes = { ok: true, text: waits() ? 'Added. Alan checks it before Jarvis reads it.' : 'Added. Jarvis reads it from now on.' }; render();
    }
    if (id === 'ask') {
      var body = val('body');
      if (body.length < 3) { S.helpRes = { ok: false, text: 'Say what’s wrong or what you need.' }; render(); return; }
      var t = { id: TICKETS.length + 1, author: who().name, body: body, status: 'new', when: 'just now' }; TICKETS.unshift(t);
      S.helpRes = { ok: true, text: 'Sent. Alan gets it within 5 minutes, and his answer shows here.' }; render();
      setTimeout(function () { t.status = 'sent'; if (S.page === 'help') render(); }, 1800);
    }
    if (id === 'add-member') {
      var mn = val('m-name'), me = val('m-email'), mr = val('m-role');
      if (!mn || !/^\S+@\S+\.\S+$/.test(me)) { S.teamRes = { ok: false, text: 'Add their name and a working email.' }; render(); return; }
      var areas = Array.prototype.slice.call(document.querySelectorAll('#m-areas input:checked')).map(function (x) { return x.value; });
      MEMBERS.push({ id: 'm' + (MEMBERS.length + 1), name: mn, email: me, role: mr, areas: mr === 'approver' ? areas : [], signed: false });
      S.teamRes = { ok: true, text: mn + ' can sign in now with ' + me + '. Tell them the link; The Block doesn’t email them.' }; render();
    }
    if (id === 'compose') {
      var to = composeCount(), text = val('c-text');
      if (!to.length) { toast('Pick at least one tier with reps on it.'); return; }
      if (text.length < 5) { toast('Write the message first.'); return; }
      S.compose.text = text;
      var first = to[0].goes || to[0].name.split(' ')[0], ask = { id: 'a' + (ASKS.length + 1), title: 'Team text to ' + to.length + ' reps', div: S.compose.div || 'Both divisions', who: 'You', agent: 'team-text', summary: to.length + ' reps · goes out once approved', preview: text.replace(/\{first\}/g, first), recips: to.slice(0, 4).map(function (r) { return r.name; }).concat(to.length > 4 ? ['+ ' + (to.length - 4) + ' more'] : []), count: to.length };
      ASKS.push(ask); render(); openSheet(ask.id);
    }
    if (id === 'reply-form') {
      var rt = val('reply-text'), th = THREADS.filter(function (x) { return x.id === S.thread; })[0] || THREADS[0];
      if (!rt) return;
      th.msgs.push(['out', rt, 'Thu 10:12 AM · sending…']); th.state = ['Delivered', 'on']; S.reply[th.id] = ''; render();
      setTimeout(function () { th.msgs[th.msgs.length - 1][2] = 'Thu 10:12 AM · delivered'; if (S.page === 'texts') render(); }, 1200);
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'roster-q') { S.q = el.value; rerenderList(); return; }
    if (el.id === 'c-text') { S.compose.text = el.value; return; }
    if (el.id === 'reply-text') { S.reply[S.thread] = el.value; return; }
    if (el.hasAttribute('data-notes')) { S.notes[el.getAttribute('data-notes')] = el.value; return; }
    if (el.id === 'gen-notes') { S.genNotes = el.value; return; }
    if (el.hasAttribute('data-path')) {
      var k = el.getAttribute('data-rk'), path = el.getAttribute('data-path');
      setVal(formFor(k), path, el.value);
      // A value the person typed is theirs, not the policy's.
      if (S.src[k] && S.src[k][path]) { delete S.src[k][path]; var sb = el.closest('.field').querySelector('.src'); if (sb) sb.remove(); }
      if (S.err[k] && S.err[k][path]) { delete S.err[k][path]; var eb = el.closest('.field').querySelector('.message.error'); if (eb) eb.remove(); }
      return;
    }
    if (el.hasAttribute('data-w')) { var p = el.getAttribute('data-w').split('.'); formFor(el.getAttribute('data-rk')).tiers[+p[0]].weights[+p[1]][p[2]] = el.value; return; }
    if (el.hasAttribute('data-tname')) { var t = S.tiersDraft[+el.getAttribute('data-tname')]; t.name = el.value; if (t.source) { t.source = null; var s2 = el.closest('.card').querySelector('.src'); if (s2) s2.remove(); } }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.hasAttribute('data-confirm')) { var k = el.getAttribute('data-rk'); S.src[k][el.getAttribute('data-confirm')].confirmed = el.checked; el.closest('.src').classList.toggle('ok', el.checked); var u = Object.keys(S.src[k]).filter(function (p) { return !S.src[k][p].confirmed; }).length; if (!u) render(); return; }
    if (el.hasAttribute('data-ranked')) { formFor(el.getAttribute('data-rk')).tiers[+el.getAttribute('data-ranked')].values.ranked = el.checked ? 'yes' : 'no'; render(); return; }
    if (el.hasAttribute('data-pick')) { S.picked[el.getAttribute('data-pick')] = el.checked; rerenderList(); return; }
    if (el.id === 'bulk-to') { S.bulkTo = el.value; return; }
    if (el.id === 'bulk-campaign') { S.bulkCampaign = el.value; return; }
    if (el.hasAttribute('data-tpicks')) { S.tiersDraft[+el.getAttribute('data-tpicks')].picks = el.checked; return; }
    if (el.hasAttribute('data-tshare')) { S.tiersDraft[+el.getAttribute('data-tshare')].share = el.checked; return; }
    if (el.hasAttribute('data-tconfirm')) { S.tiersDraft[+el.getAttribute('data-tconfirm')].source.confirmed = el.checked; el.closest('.src').classList.toggle('ok', el.checked); return; }
    if (el.hasAttribute('data-src')) { S.imp.source = el.getAttribute('data-src'); S.imp.read = false; render(); return; }
    if (el.hasAttribute('data-tick')) { S.imp.ticked[el.getAttribute('data-tick')] = el.checked; render(); return; }
    if (el.getAttribute('data-imp') === 'div') { S.imp.div = el.value; render(); return; }
    if (el.getAttribute('data-imp') === 'tier') { S.imp.tier = el.value; return; }
    if (el.id === 'm-role') { document.getElementById('m-areas').hidden = el.value !== 'approver'; return; }
    if (el.hasAttribute('data-pref')) { var key = el.getAttribute('data-pref'); S.prefs = S.prefs.filter(function (x) { return x !== key; }); if (el.checked) S.prefs.push(key); toast('Saved.'); return; }
    if (el.hasAttribute('data-ctier') || el.hasAttribute('data-cdiv')) {
      if (el.hasAttribute('data-ctier')) S.compose.tiers[el.getAttribute('data-ctier')] = el.checked; else S.compose.div = el.value;
      var n = composeCount().length, c = document.getElementById('c-count');
      if (c) c.textContent = 'Goes to ' + n + ' ' + plural(n, 'rep') + '. Reps with no phone on the roster, and anyone who texted STOP, are left out.';
    }
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-jump],[data-go],[data-act],[data-div],[data-show],[data-open],[data-thread]');
    if (!t || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'button')) return;
    if (t.tagName === 'A') e.preventDefault();
    if (t.hasAttribute('data-jump')) {
      var j = t.getAttribute('data-jump');
      S.stage = j; S.auth = 'email'; S.authNote = null; if (j === 'app') S.page = 'today';
      render(); window.scrollTo(0, 0); return;
    }
    if (t.hasAttribute('data-thread')) S.thread = t.getAttribute('data-thread');
    if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-div')) { S.div = t.getAttribute('data-div') || null; render(); return; }
    if (t.hasAttribute('data-show')) { S.show = t.getAttribute('data-show'); rerenderList(); return; }
    if (t.hasAttribute('data-open')) { openSheet(t.getAttribute('data-open')); return; }
    if (t.hasAttribute('data-thread')) { render(); return; }
    var act = t.getAttribute('data-act'), k = t.getAttribute('data-rk');
    if (['save', 'send', 'draft', 'notes', 'restore', 'discard', 'w-add', 'w-remove'].indexOf(act) > -1) { rulesAct(act, k, t); return; }
    switch (act) {
      case 'restart': S.auth = 'email'; render(); break;
      case 'resend': toast('A new code is on its way. The last one stops working.'); break;
      case 'app-open': S.stage = 'signin'; S.auth = 'email'; S.authNote = 'The Home Screen app keeps its own sign-in, so it stays signed in. Enter your email once more for a code.'; render(); break;
      case 'next': if (S.step < 5) { S.step++; render(); } else { S.stage = 'app'; S.page = 'today'; render(); toast('All set. Your read-only agents start with the next scheduled run.'); } window.scrollTo(0, 0); break;
      case 'back': if (S.step > 1) { S.step--; render(); } break;
      case 'skip': S.stage = 'app'; S.page = 'today'; render(); break;
      case 'file-remove': S.files.splice(+t.getAttribute('data-i'), 1); render(); break;
      case 'vc-save': S.vc = 'locked'; render(); setTimeout(function () { S.vc = 'verified'; if (S.stage === 'setup' && S.step === 4) render(); }, 1600); break;
      case 'push-on': S.pushHere = 'on'; S.nudge = false; S.pushRes = S.page === 'today' ? 'Notifications are on for this iPhone.' : null; render(); if (S.page !== 'today') toast('Notifications are on for this iPhone.'); break;
      case 'push-later': S.nudge = false; render(); break;
      case 'push-off': S.pushHere = 'none'; render(); toast('Turned off on this iPhone.'); break;
      case 'push-test': toast('Test sent. It should arrive on this iPhone in a few seconds.'); break;
      case 'pause':
        var pa = AGENTS.filter(function (x) { return x.key === k; })[0];
        if (pa.state === 'paused') { pa.state = pa.was || 'on'; pa.note = 'Turned back on by you just now'; toast(pa.name + ' is back on.'); }
        else { pa.was = pa.state; pa.state = 'paused'; pa.note = 'Paused by you just now · nothing runs until someone turns it back on'; toast(pa.name + ' is paused. It stops before its next text or filing.'); }
        render(); break;
      case 'member-remove': MEMBERS = MEMBERS.filter(function (m) { return m.id !== t.getAttribute('data-i'); }); render(); break;
      case 'signout': case 'signout-all': S.stage = 'signin'; S.auth = 'email'; S.authNote = null; render(); toast(act === 'signout' ? 'Signed out on this device.' : 'Signed out on every device.'); break;
      case 'open-setup': S.stage = 'setup'; S.step = 1; render(); window.scrollTo(0, 0); break;
      case 'split': toast('This starts ' + S.div + '’s own rules from the shared ones, and the tab shows them.'); break;
      case 'doc-refresh': toast('Read again just now. Jarvis reads the latest version.'); break;
      case 'doc-remove': DOCS = DOCS.filter(function (x) { return String(x.id) !== t.getAttribute('data-i'); }); render(); toast('Removed. Jarvis stops reading it right away.'); break;
      case 'pick-toggle': S.picking = !S.picking; S.picked = {}; S.rosterRes = null; render(); break;
      case 'bulk':
        var ids = Object.keys(S.picked).filter(function (i) { return S.picked[i]; }), v = t.getAttribute('data-v'), cl = CAMPAIGNS.filter(function (c) { return c[0] === S.bulkCampaign; })[0][1];
        ids.forEach(function (i) { var r = REPS.filter(function (x) { return x.id === i; })[0]; if (v === 'move') { r.tier = S.bulkTo; r.history.push([cl, tierName(S.bulkTo), 'Thu, Dec 10']); } else { r.status = v; r.history.push([cl, v === 'left' ? 'Left the team (was ' + tierName(r.tier) + ')' : tierName(r.tier), 'Thu, Dec 10']); } });
        S.rosterRes = { ok: true, text: v === 'move' ? 'Moved ' + ids.length + ' ' + plural(ids.length, 'rep') + '.' : ids.length + ' ' + plural(ids.length, 'rep') + (v === 'left' ? ' marked as left. They stay on your roster under Left.' : ' back on the team.') };
        S.picking = false; S.picked = {}; render(); break;
      case 'rep-status':
        var rr = REPS.filter(function (x) { return x.id === S.rep; })[0]; rr.status = rr.status === 'left' ? 'active' : 'left';
        rr.history.push(['Fall 2026', rr.status === 'left' ? 'Left the team (was ' + tierName(rr.tier) + ')' : tierName(rr.tier), 'Thu, Dec 10']); S.done = rr.status; render(); break;
      case 'contact': toast('Example: on a phone this opens ' + t.getAttribute('data-v') + '.'); break;
      case 'suggest-tiers':
        S.suggesting = true; render();
        setTimeout(function () {
          S.suggesting = false;
          var q = [['Varsity', true, 2, 'Varsity: our top tier, ranked first at every picking meeting.'], ['JV', true, 2, 'JV reps pick after Varsity.'], ['Freshmen', true, 2, 'Freshmen are new this campaign and pick last.'], ['Leaders', false, 3, 'Leaders run the shows and don’t pick shifts.']];
          S.tiersDraft = q.map(function (x, i) { var old = TIERS[i]; return { id: old ? old.id : null, name: x[0], picks: x[1], share: old ? old.share : true, source: { page: x[2], quote: x[3], confirmed: false } }; });
          S.tiersRes = { ok: true, text: 'Suggested 4 tiers from “' + POLICY + '”. Tick “This is right” on each before you save.' };
          if (S.page === 'tiers') render();
        }, 1400);
        break;
      case 'tier-move': var i = +t.getAttribute('data-i'), by = +t.getAttribute('data-v'), a = S.tiersDraft; var tmp = a[i]; a[i] = a[i + by]; a[i + by] = tmp; render(); break;
      case 'tier-remove': S.tiersDraft.splice(+t.getAttribute('data-i'), 1); render(); break;
      case 'tier-add': S.tiersDraft.push({ id: null, name: '', picks: true, share: true, source: null }); render(); break;
      case 'tiers-save':
        var D = S.tiersDraft;
        if (D.some(function (x) { return !x.name.trim(); })) { S.tiersRes = { ok: false, text: 'Every tier needs a name.' }; render(); break; }
        if (D.some(function (x) { return x.source && !x.source.confirmed; })) { S.tiersRes = { ok: false, text: 'Tick “This is right” on each suggested tier first, or type the name yourself.' }; render(); break; }
        TIERS = D.map(function (x, n) { return { id: x.id || 'tn' + n, name: x.name.trim(), picks: x.picks, share: x.share }; });
        S.tiersDraft = null; S.tiersRes = { ok: true, text: 'Your tiers are saved.' }; render(); break;
      case 'bring-in':
        var I = S.imp, took = 0, filled = 0;
        CLASS_ROWS.forEach(function (r) {
          var on = !r.problems && (I.ticked[r.line] !== undefined ? I.ticked[r.line] : r.pick); if (!on) return;
          if (r.match) { var m = REPS.filter(function (x) { return x.name === r.match.name; })[0]; if (m && r.match.fills.indexOf('phone') > -1 && !m.phone) { m.phone = r.phone; filled++; } return; }
          var nr = rep('c' + r.line, r.name, I.tier, I.div, r.phone, r.email, r.num); nr.since = 'Spring 2027'; nr.history = [['Spring 2027', tierName(I.tier), 'Thu, Dec 10']]; REPS.push(nr); took++;
        });
        S.imp = null; S.rosterRes = { ok: true, text: 'Brought in ' + took + ' ' + plural(took, 'rep') + (filled ? ' and filled in ' + filled + ' already on your roster' : '') + '.' }; go('roster'); break;
      case 'link': toast('Example: this opens the app in a new tab.'); break;
      case 'toast': toast(t.getAttribute('data-v')); break;
    }
  });

  render();
  // Tell the page around this example that it loaded (the explorer shows a note if it never does).
  try { if (window.parent !== window) window.parent.postMessage({ blockDemo: 'ready' }, '*'); } catch (e) { /* standalone */ }
})();
</script>
